<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Stars Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        body {
            background: radial-gradient(ellipse at top, #1e1b4b 0%, #0f0c29 40%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            background: #7c3aed;
            top: -150px;
            left: -150px;
            animation: float 12s ease-in-out infinite;
        }

        body::after {
            background: #06b6d4;
            bottom: -150px;
            right: -150px;
            animation: float 14s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(60px, 40px) scale(1.1); }
        }

        .app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            max-width: 600px;
            width: 100%;
            padding-bottom: 40px;
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
        }

        .subtitle {
            color: #a1a1aa;
            font-size: 1rem;
            margin-top: -14px;
            text-align: center;
        }

        #webcam-container {
            width: 360px;
            height: 360px;
            max-width: 90vw;
            max-height: 90vw;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 20px 60px rgba(124, 58, 237, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            border-radius: 28px;
        }

        #label-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #label-container > div {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        #label-container > div:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        #label-container > div span.prob {
            font-variant-numeric: tabular-nums;
            color: #22d3ee;
            font-weight: 800;
        }

        button {
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 16px 48px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
            box-shadow:
                0 10px 30px rgba(124, 58, 237, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 0.02em;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 15px 40px rgba(236, 72, 153, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.15) inset;
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            color: #a1a1aa;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="app">
        <h1>⚽ Football Stars Classifier</h1>
        <p class="subtitle">Teachable Machine · Real-time recognition</p>

        <div id="webcam-container"></div>

        <button type="button" id="start-btn" onclick="init(this)">▶ Start</button>
        <div class="status" id="status">Нажмите кнопку, чтобы запустить камеру</div>

        <div id="label-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        // Ссылка на твою модель Teachable Machine
        const URL = "https://teachablemachine.withgoogle.com/models/DGLZUzcE5/";

        let model, webcam, labelContainer, maxPredictions;

        async function init(btn) {
            const statusEl = document.getElementById('status');
            try {
                btn.disabled = true;
                statusEl.textContent = "Загрузка модели...";

                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true;
                webcam = new tmImage.Webcam(360, 360, flip);
                await webcam.setup();
                await webcam.play();

                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }

                statusEl.textContent = "Классификация активна";
                btn.style.display = "none";
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Ошибка: " + err.message;
                btn.disabled = false;
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const pred = prediction[i];
                const prob = (pred.probability * 100).toFixed(1) + "%";
                labelContainer.childNodes[i].innerHTML =
                    `<span>${pred.className}</span><span class="prob">${prob}</span>`;
            }
        }
    </script>
</body>
</html>
