<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football test</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-green: #00ff73;
            --btn-color: #ff0055;
            --btn-hover: #ff3377;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        #app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        #media-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 250px;
        }

        #webcam-container canvas {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 255, 115, 0.2);
            border: 3px solid #333;
            transition: all 0.3s ease;
        }

        #player-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
            display: none;
            border: 3px solid var(--accent-green);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #label-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }

        .label-row {
            font-size: 1.8rem;
            font-weight: 700;
            background: #222;
            padding: 15px 25px;
            border-radius: 15px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
        }

        .highlight {
            color: var(--accent-green);
            background: rgba(0, 255, 115, 0.1);
            border: 2px solid var(--accent-green);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 115, 0.4);
            font-size: 2.2rem;
            font-weight: 900;
        }

        button {
            margin-top: 30px;
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: white;
            background-color: var(--btn-color);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--btn-hover);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 0, 85, 0.6);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Football Test</h1>
    
    <div id="app-container">
        <div id="media-container">
            <div id="webcam-container"></div>
            <img id="player-image" src="" alt="Футболист">
        </div>
        
        <div id="label-container"></div>
        
        <button type="button" id="start-btn" onclick="init()">Start</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/DGLZUzcE5/";

        const playersData = {
            "GARACHO": {
                img: "https://www.shutterstock.com/editorial/image-editorial/M1TfU93fM2D7E643MjY3MzM=/alejandro-garnacho-chelsea-440nw-15544941ac.jpg",
                voice: "донер кебаб начо алехандро гарнчо"
            },
            "RONALDO": {
                img: "https://i.pinimg.com/originals/6f/06/03/6f0603153db8f791e347dda3f5e6f582.jpg",
                voice: "суууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууу"
            },
            "MATVEY SAFONOV": {
                img: "https://img.championat.com/oB_5UM2ac7jD991bAwYyAljLhGQ-bBDEMCDJ0N09Va0/p(q:0)/news/big/g/j/matvej-safonov-podelilsya-vpechatleniyami-ot-prazdnovaniya-pobedy-v-lige-chempionov_1780418486508681364.jpg",
                voice: "ну что хейтеры что сейчас скажите"
            },
            "NEYMAR JR": {
                img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/BRASIL_5_MAV_%28Neymar_celebrating%29_%28cropped%29.jpg/250px-BRASIL_5_MAV_%28Neymar_celebrating%29_%28cropped%29.jpg",
                voice: "наймар джуниор сантос"
            },
            "MESSI": {
                img: "https://s0.rbk.ru/v6_top_pics/media/img/9/96/756713803974969.jpg",
                voice: "ун кара месси месси месси месси месси месси ун кара месси месси месси"
            }
        };

        let model, webcam, labelContainer, maxPredictions;
        let currentWinner = ""; 

        async function init() {
            let utterance = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(utterance);

            document.getElementById("start-btn").style.display = "none";

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(250, 250, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                let div = document.createElement("div");
                div.className = "label-row";
                labelContainer.appendChild(div);
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let highestProb = 0;
            let highestClass = "";
            let highestIndex = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    highestClass = prediction[i].className;
                    highestIndex = i;
                }
            }

            for (let i = 0; i < maxPredictions; i++) {
                const percent = Math.round(prediction[i].probability * 100);
                labelContainer.childNodes[i].innerHTML = `<span>${prediction[i].className}</span> <span>${percent}%</span>`;
                
                // Подсвечиваем класс зеленым цветом, если уверенность больше 25% (0.25)
                if (i === highestIndex && highestProb > 0.25) {
                    labelContainer.childNodes[i].classList.add("highlight");
                } else {
                    labelContainer.childNodes[i].classList.remove("highlight");
                }
            }

            // Запускаем эффекты (звук, фото, конфетти), если уверенность больше 25%
            if (highestProb > 0.25) {
                if (highestClass !== currentWinner) {
                    currentWinner = highestClass;
                    triggerEffects(highestClass);
                }
            // Сбрасываем текущего футболиста, только если уверенность падает ниже 10%
            } else if (highestProb < 0.10) {
                currentWinner = "";
                document.getElementById("player-image").style.display = "none";
            }
        }

        function triggerEffects(className) {
            let matchedKey = Object.keys(playersData).find(key => className.toUpperCase().includes(key.toUpperCase()));
            
            if (matchedKey) {
                const data = playersData[matchedKey];
                
                const imgEl = document.getElementById("player-image");
                imgEl.src = data.img;
                imgEl.style.display = "block";

                speak(data.voice);
                shootFootballConfetti();
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel(); 
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ru-RU'; 
            msg.rate = 1.0;     
            msg.pitch = 1.0;    
            window.speechSynthesis.speak(msg);
        }

        function shootFootballConfetti() {
            const scalar = 3;
            const football = confetti.shapeFromText({ text: '⚽', scalar });

            confetti({
                shapes: [football],
                particleCount: 40,
                spread: 100,
                origin: { y: 0.6 },
                scalar: 2,
                ticks: 150
            });
            
            confetti({
                particleCount: 30,
                spread: 120,
                origin: { y: 0.6 },
                colors: ['#FFD700', '#00FF73', '#FFFFFF']
            });
        }
    </script>
</body>
</html>
